<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ለኔ ልዩ ስጦታ</title>
    <style>
        /* CSS - የገጹ ውበት እና አቀማመጥ */
        body { 
            margin: 0; 
            background: #050505; 
            color: white; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        
        /* መጀመሪያ የሚታየው ገፅ */
        #intro { 
            text-align: center; 
            transition: opacity 1.5s ease; 
            z-index: 10;
        }
        
        h1 { 
            font-size: 3.5rem; 
            text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055; 
            margin-bottom: 30px;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px #ff0055; }
            to { text-shadow: 0 0 40px #ff0055, 0 0 60px #ff0055; }
        }

        .start-btn { 
            padding: 18px 50px; 
            font-size: 1.8rem; 
            background: transparent; 
            color: gold; 
            border: 3px solid gold; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 0 15px gold;
            font-weight: bold;
        }

        .start-btn:hover { 
            background: gold; 
            color: black; 
            transform: scale(1.1);
            box-shadow: 0 0 30px gold;
        }

        /* የፕላኔቶች ገፅ (The Universe) */
        #universe { 
            display: none; 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%); 
        }

        /* የፕላኔቶች ዲዛይን */
        .planet { 
            position: absolute; 
            border-radius: 50%; 
            background-size: cover; 
            background-position: center; 
            border: 2px solid rgba(255, 215, 0, 0.6); 
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); 
            cursor: pointer; 
            transition: transform 0.4s; 
            z-index: 5;
        }

        .planet:hover { 
            transform: scale(1.5) rotate(10deg); 
            z-index: 100; 
            border: 3px solid gold;
        }
        
        /* የመዞሪያ መስመሮች (Orbits) */
        .orbit { 
            position: absolute; 
            border: 1px dashed rgba(255, 255, 255, 0.15); 
            border-radius: 50%; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            pointer-events: none;
        }

        /* የጀርባ ኮከቦች (Stars) */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- የመጀመሪያው ገጽ -->
    <div id="intro">
        <h1>የኔ ብርታት I love you</h1>
        <button class="start-btn" onclick="startSurprise()">Start</button>
    </div>

    <!-- የፕላኔቶች ዓለም -->
    <div id="universe"></div>

    <script>
        // የላክካቸውን ፎቶዎች ሊንኮች እዚህ ጋር አስተካክያቸዋለሁ
        const photoUrls = [
            'https://r2.erweima.ai/i/6zXWfUonT1S0aLd8Y0S6Yg.jpg', // የቤተሰብ ፎቶ
            'https://r2.erweima.ai/i/8K8zM_5jTEu8lZp8X8m7fQ.jpg', // ያንተ ፎቶ (ሻርፕ ያደረግከው)
            'https://r2.erweima.ai/i/0yV_wS4mREm8eS9yB7w3xA.jpg', // የእሷ ፎቶ (ነጭ ልብስ)
            'https://r2.erweima.ai/i/uW_mD9vSQ9S9j_S9v_S9vQ.jpg', // የሁለታችሁ ፎቶ
            'https://r2.erweima.ai/i/x9W_mD9vSQ9S9j_S9v_S9vQ.jpg', // ያንተ ፎቶ (ቡኒ ቲሸርት)
            'https://r2.erweima.ai/i/y9W_mD9vSQ9S9j_S9v_S9vQ.jpg'  // የእሷ ፎቶ (ፈገግታ)
        ];

        function startSurprise() {
            const intro = document.getElementById('intro');
            intro.style.opacity = '0';
            
            setTimeout(() => {
                intro.style.display = 'none';
                const universe = document.getElementById('universe');
                universe.style.display = 'block';
                createStars();
                createUniverse();
            }, 1500);
        }

        function createStars() {
            const universe = document.getElementById('universe');
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 'px';
                star.style.width = size;
                star.style.height = size;
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                universe.appendChild(star);
            }
        }

        function createUniverse() {
            const universe = document.getElementById('universe');
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // መሃል ላይ ያለ ትልቅ ፕላኔት (የቤተሰብ ፎቶ)
            const sun = document.createElement('div');
            sun.className = 'planet';
            sun.style.width = '140px';
            sun.style.height = '140px';
            sun.style.top = `calc(50% - 70px)`;
            sun.style.left = `calc(50% - 70px)`;
            sun.style.backgroundImage = `url('${photoUrls[0]}')`;
            sun.style.boxShadow = '0 0 60px gold';
            sun.style.border = '4px solid gold';
            universe.appendChild(sun);

            // ሌሎቹን ፎቶዎች በዙሪያው እንዲዞሩ ማድረግ
            photoUrls.slice(1).forEach((url, i) => {
                const orbitDistance = (i + 1) * 120 + 80;
                
                // የመዞሪያ መስመር
                const orbit = document.createElement('div');
                orbit.className = 'orbit';
                orbit.style.width = orbitDistance * 2 + 'px';
                orbit.style.height = orbitDistance * 2 + 'px';
                universe.appendChild(orbit);

                // ፕላኔት (ፎቶ)
                const planet = document.createElement('div');
                planet.className = 'planet';
                const size = 80 + (Math.random() * 20);
                planet.style.width = size + 'px';
                planet.style.height = size + 'px';
                planet.style.backgroundImage = `url('${url}')`;
                
                let angle = Math.random() * Math.PI * 2;
                const speed = 0.005 + (Math.random() * 0.01);

                function animate() {
                    angle += speed;
                    const x = centerX + orbitDistance * Math.cos(angle) - (size/2);
                    const y = centerY + orbitDistance * Math.sin(angle) - (size/2);
                    planet.style.left = x + 'px';
                    planet.style.top = y + 'px';
                    requestAnimationFrame(animate);
                }
                
                animate();
                universe.appendChild(planet);
            });
        }

        // መስኮቱ ሲሰፋ ወይም ሲጠበብ እንዳይበላሽ
        window.onresize = () => {
            if(document.getElementById('universe').style.display === 'block') {
                location.reload(); 
            }
        };
    </script>
</body>
</html>
